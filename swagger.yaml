openapi: 3.0.0
info:
  title: Smart Gym Management API
  description: |
    REST API for our gym management system built as a database course project.
    
    Main features:
    - User authentication with JWT tokens
    - Different dashboards for members, trainers, staff, and admins
    - Class booking system with automatic waitlist
    - Workout and nutrition tracking
    - Revenue analytics and reporting
    
    Built with Flask (Python) and PostgreSQL.
    
  version: 1.0.0

servers:
  - url: http://localhost:5000/api/v1
    description: Local development server

tags:
  - name: Authentication
    description: User registration and login
  - name: Members
    description: Member-specific operations (requires member role)
  - name: Trainers
    description: Trainer operations (requires trainer role)
  - name: Staff
    description: Staff operations (requires staff role)
  - name: Admin
    description: Administrative operations (requires admin role)
  - name: Public
    description: Public endpoints (no authentication required)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login endpoint
  
  schemas:
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        email:
          type: string
          example: john.doe@gym.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        phone:
          type: string
          example: "0300-1234567"
        role:
          type: string
          enum: [member, trainer, staff, admin]
          example: member
        date_of_birth:
          type: string
          format: date
          example: "1990-01-01"
        gender:
          type: string
          enum: [male, female, other]
          example: male
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
    
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Invalid credentials
        details:
          type: string
    
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 50
        total_pages:
          type: integer
          example: 3

paths:
  # ==================== AUTHENTICATION ====================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - first_name
                - last_name
                - role
              properties:
                email:
                  type: string
                  example: john.doe@gym.com
                password:
                  type: string
                  minLength: 8
                  example: SecurePass123
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
                phone:
                  type: string
                  example: "0300-1234567"
                role:
                  type: string
                  enum: [member, trainer, staff, admin]
                  example: member
                date_of_birth:
                  type: string
                  format: date
                  example: "1990-01-01"
                gender:
                  type: string
                  enum: [male, female, other]
                  example: male
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  user_id:
                    type: integer
                    example: 25
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: john.doe@gym.com
                password:
                  type: string
                  example: SecurePass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGc...
                  user:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      role:
                        type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user info
      description: Returns logged-in user's information (requires valid JWT)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      role:
                        type: string
                      phone:
                        type: string
        '401':
          description: Token missing or invalid

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout (client-side token removal)
      description: Since JWT is stateless, logout happens on client side by removing token
      responses:
        '200':
          description: Logout acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Logged out successfully. Please remove token from client.

  # ==================== MEMBERS ====================
  /members/dashboard:
    get:
      tags:
        - Members
      summary: Get member dashboard
      description: Returns comprehensive stats from database view
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard data retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  dashboard:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      full_name:
                        type: string
                      email:
                        type: string
                      membership_tier:
                        type: string
                      membership_status:
                        type: string
                      total_visits:
                        type: integer
                      confirmed_bookings:
                        type: integer
                      total_calories_burned:
                        type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - member role required

  /members/membership:
    get:
      tags:
        - Members
      summary: Get active membership
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active membership details
        '404':
          description: No active membership found

  /members/bookings:
    get:
      tags:
        - Members
      summary: Get class bookings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmed, waitlist, cancelled, attended]
        - name: upcoming
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of bookings

  /members/book-class:
    post:
      tags:
        - Members
      summary: Book a class
      description: Book a class (trigger handles capacity/waitlist automatically)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - schedule_id
              properties:
                schedule_id:
                  type: integer
                  example: 7
      responses:
        '201':
          description: Class booked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  booking:
                    type: object
                    properties:
                      booking_id:
                        type: integer
                      status:
                        type: string
                      position_in_waitlist:
                        type: integer
                        nullable: true
        '409':
          description: Already booked

  /members/bookings/{booking_id}:
    delete:
      tags:
        - Members
      summary: Cancel booking
      description: Cancel a class booking (auto-promotes waitlist)
      security:
        - BearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking cancelled
        '404':
          description: Booking not found

  /members/workouts:
    get:
      tags:
        - Members
      summary: Get workout logs
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of workout logs
    
    post:
      tags:
        - Members
      summary: Log a workout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - exercise_name
              properties:
                workout_date:
                  type: string
                  format: date
                exercise_name:
                  type: string
                  example: Bench Press
                muscle_group:
                  type: string
                  example: Chest
                sets:
                  type: integer
                  example: 3
                reps:
                  type: integer
                  example: 8
                weight_kg:
                  type: number
                  example: 60.0
                duration_minutes:
                  type: integer
                calories_burned:
                  type: integer
                difficulty:
                  type: string
                  enum: [easy, moderate, hard]
                notes:
                  type: string
      responses:
        '201':
          description: Workout logged successfully

  /members/profile:
    get:
      tags:
        - Members
      summary: Get profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
    
    put:
      tags:
        - Members
      summary: Update profile
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                gender:
                  type: string
      responses:
        '200':
          description: Profile updated

  # ==================== ADMIN ====================
  /admin/users:
    get:
      tags:
        - Admin
      summary: List all users
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum: [member, trainer, staff, admin]
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    
    post:
      tags:
        - Admin
      summary: Create new user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created

  /admin/users/{user_id}:
    put:
      tags:
        - Admin
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: User updated
    
    delete:
      tags:
        - Admin
      summary: Deactivate user
      description: Soft delete (sets is_active = false)
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deactivated

  /admin/revenue:
    get:
      tags:
        - Admin
      summary: Get revenue analytics
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Revenue breakdown

  /admin/analytics:
    get:
      tags:
        - Admin
      summary: Get system analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Comprehensive system statistics

  /admin/memberships:
    get:
      tags:
        - Admin
      summary: List all memberships
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: tier_id
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Memberships list

  /admin/equipment-health:
    get:
      tags:
        - Admin
      summary: Equipment health report
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Equipment health data from view

  # ==================== PUBLIC ====================
  /classes:
    get:
      tags:
        - Public
      summary: Get all class types
      description: No authentication required
      responses:
        '200':
          description: List of class types

  /classes/schedule:
    get:
      tags:
        - Public
      summary: Get class schedules
      description: View upcoming class schedules (no auth required)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
        - name: class_id
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of scheduled classes

  /membership-tiers:
    get:
      tags:
        - Public
      summary: Get membership tiers
      description: View pricing and features (no auth required)
      responses:
        '200':
          description: List of membership tiers

  /trainers:
    get:
      tags:
        - Public
      summary: Get trainers
      description: Browse trainer profiles (no auth required)
      parameters:
        - name: available
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of trainers

  # ==================== TRAINERS ====================
  /trainers/clients:
    get:
      tags:
        - Trainers
      summary: Get assigned clients
      description: List all members with workout/nutrition plans from this trainer
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of assigned clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  clients:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        full_name:
                          type: string
                        email:
                          type: string
                        membership_tier:
                          type: string
                        workout_plans:
                          type: integer
                        nutrition_plans:
                          type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - trainer role required

  /trainers/performance:
    get:
      tags:
        - Trainers
      summary: Get performance metrics
      description: Returns data from trainer_performance_view
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Performance metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  performance:
                    type: object
                    properties:
                      trainer_id:
                        type: integer
                      trainer_name:
                        type: string
                      total_clients:
                        type: integer
                      workout_plans_created:
                        type: integer
                      nutrition_plans_created:
                        type: integer
                      classes_scheduled:
                        type: integer
                      average_rating:
                        type: string
        '404':
          description: Performance data not found

  /trainers/schedule:
    get:
      tags:
        - Trainers
      summary: Get upcoming class schedule
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Upcoming schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  schedules:
                    type: array
                    items:
                      type: object
                      properties:
                        schedule_id:
                          type: integer
                        class_name:
                          type: string
                        schedule_date:
                          type: string
                        start_time:
                          type: string
                        spots_available:
                          type: integer
                        status:
                          type: string

  /trainers/workout-plans:
    get:
      tags:
        - Trainers
      summary: Get all workout plans
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of workout plans
    post:
      tags:
        - Trainers
      summary: Create workout plan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - plan_name
                - goal
              properties:
                user_id:
                  type: integer
                  example: 1
                plan_name:
                  type: string
                  example: Strength Training Plan
                goal:
                  type: string
                  example: Build muscle mass
                description:
                  type: string
      responses:
        '201':
          description: Workout plan created
        '400':
          description: Missing required fields
        '404':
          description: Member not found

  /trainers/nutrition-plans:
    get:
      tags:
        - Trainers
      summary: Get all nutrition plans
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of nutrition plans
    post:
      tags:
        - Trainers
      summary: Create nutrition plan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - plan_name
                - daily_calories
              properties:
                user_id:
                  type: integer
                  example: 1
                plan_name:
                  type: string
                  example: Weight Loss Diet
                daily_calories:
                  type: integer
                  example: 2000
                protein_grams:
                  type: integer
                  example: 150
                carbs_grams:
                  type: integer
                  example: 200
                fat_grams:
                  type: integer
                  example: 65
      responses:
        '201':
          description: Nutrition plan created
        '400':
          description: Missing required fields
        '404':
          description: Member not found

  # ==================== STAFF ====================
  /staff/checkin:
    post:
      tags:
        - Staff
      summary: Check in a member
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - member_id
              properties:
                member_id:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Member checked in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  attendance_id:
                    type: integer
                  member:
                    type: string
                  membership_tier:
                    type: string
                  check_in_time:
                    type: string
        '403':
          description: No active membership
        '404':
          description: Member not found
        '409':
          description: Already checked in

  /staff/checkout:
    post:
      tags:
        - Staff
      summary: Check out a member
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - member_id
              properties:
                member_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Member checked out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  member:
                    type: string
                  duration_minutes:
                    type: number
                  check_out_time:
                    type: string
        '404':
          description: No active check-in found

  /staff/attendance/today:
    get:
      tags:
        - Staff
      summary: Get today's attendance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Today's attendance list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  date:
                    type: string
                  total_visits:
                    type: integer
                  currently_in:
                    type: integer
                  attendance:
                    type: array
                    items:
                      type: object
                      properties:
                        member_name:
                          type: string
                        check_in_time:
                          type: string
                        check_out_time:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [present, left]

  /staff/lockers/{locker_id}:
    put:
      tags:
        - Staff
      summary: Assign or release a locker
      security:
        - BearerAuth: []
      parameters:
        - name: locker_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [assign, release]
                  example: assign
                member_id:
                  type: integer
                  description: Required when action is assign
                  example: 1
      responses:
        '200':
          description: Locker updated successfully
        '400':
          description: Invalid action or missing member_id
        '404':
          description: Locker not found
        '409':
          description: Locker already occupied

  /staff/equipment:
    get:
      tags:
        - Staff
      summary: Get all equipment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Equipment list with summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      available:
                        type: integer
                      in_use:
                        type: integer
                      maintenance:
                        type: integer
                      broken:
                        type: integer
                  equipment:
                    type: array
                    items:
                      type: object
                      properties:
                        equipment_id:
                          type: integer
                        equipment_name:
                          type: string
                        zone:
                          type: string
                        status:
                          type: string
                          enum: [available, in_use, maintenance, broken]

  /staff/equipment/{equipment_id}:
    put:
      tags:
        - Staff
      summary: Update equipment status
      security:
        - BearerAuth: []
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, in_use, maintenance, broken]
                last_maintenance_date:
                  type: string
                  format: date
                next_maintenance_due:
                  type: string
                  format: date
                total_usage_hours:
                  type: integer
      responses:
        '200':
          description: Equipment updated
        '400':
          description: Invalid status or no fields to update
        '404':
          description: Equipment not found

  # ==================== PAYMENTS & TRANSACTIONS ====================
  /payments/purchase-membership:
    post:
      tags:
        - Members
      summary: Purchase membership (ACID Transaction)
      description: |
        Atomic transaction that creates membership, payment, and optionally assigns locker.
        All steps succeed together or rollback on any failure.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tier_id
                - payment_method
              properties:
                tier_id:
                  type: integer
                  example: 1
                payment_method:
                  type: string
                  enum: [cash, credit_card, debit_card, online]
                  example: credit_card
      responses:
        '201':
          description: Membership purchased successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  transaction:
                    type: object
                    properties:
                      membership_id:
                        type: integer
                      payment_id:
                        type: integer
                      locker_id:
                        type: integer
                        nullable: true
        '400':
          description: Missing tier_id or invalid payment method
        '404':
          description: Membership tier not found
        '409':
          description: Already has active membership

  /payments/history:
    get:
      tags:
        - Members
      summary: Get payment history
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payment history list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        payment_id:
                          type: integer
                        amount:
                          type: number
                        payment_method:
                          type: string
                        payment_type:
                          type: string
                        status:
                          type: string
                        payment_date:
                          type: string